<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MOONSTAR EXPRESS LLC — Executive Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .brand-font { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="brand-font text-2xl font-black text-slate-900 tracking-wide">MOON<span class="text-orange-500">★</span>TAR</span>
            <span class="text-xs font-semibold text-sky-600 border border-sky-600 px-2 py-0.5 rounded">EXPRESS LLC</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12 w-full grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
        <div class="bg-slate-900 text-white p-10 rounded-2xl shadow-xl relative overflow-hidden">
            <h1 class="brand-font text-3xl font-black mb-4 leading-tight">RELIABLE TRANSPORTATION SOLUTIONS</h1>
            <p class="text-slate-400 text-sm mb-6">Your trusted partner for safe and efficient nationwide freight and fleet management.</p>
            <div class="text-sky-400 font-bold text-sm">📞 +1 215-666-0595</div>
        </div>

        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="brand-font text-xl font-bold text-slate-900 mb-6">🔐 Executive Portal Login</h2>
            
            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-600 text-xs p-3 rounded-lg mb-4 font-medium">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Corporate Email</label>
                    <input type="email" name="email" required placeholder="ismail@moonstarpa.com" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-sky-600">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-sky-600">
                </div>
                <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold uppercase tracking-wider rounded-lg transition shadow-md">
                    Sign In to Portal
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        &copy; 2026 Moonstar Express LLC. All rights reserved.
    </footer>

</body>
</html>
